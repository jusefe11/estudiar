name: Proyecto

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Seleccione el ambiente"
        required: true
        default: DEV
        type: choice
        options:
          - DEV
          - QA
          - PROD

jobs:
  terraform:

    name: Terraform

    runs-on: ubuntu-latest

    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: terraform/environments/${{ lower(github.event.inputs.environment) }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Show Environment
        run: |
          echo "Ambiente seleccionado: ${{ github.event.inputs.environment }}"
          echo "Directorio: terraform/environments/${{ lower(github.event.inputs.environment) }}"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan