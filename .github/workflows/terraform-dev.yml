name: Proyecto

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Seleccione el ambiente"
        required: true
        default: DEV
        type: choice
        options:
          - DEV
          - QA
          - PROD

jobs:
  terraform:

    name: Terraform

    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event.inputs.environment }}

    defaults:
      run:
        shell: bash

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Seleccionar directorio Terraform
        run: |
          if [ "${{ github.event.inputs.environment }}" = "DEV" ]; then
            echo "TF_DIR=terraform/environments/dev" >> $GITHUB_ENV
          elif [ "${{ github.event.inputs.environment }}" = "QA" ]; then
            echo "TF_DIR=terraform/environments/qa" >> $GITHUB_ENV
          else
            echo "TF_DIR=terraform/environments/prod" >> $GITHUB_ENV
          fi

      - name: Mostrar ambiente
        run: |
          echo "Ambiente: ${{ github.event.inputs.environment }}"
          echo "Directorio: $TF_DIR"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform Init
        run: terraform -chdir=$TF_DIR init

      - name: Terraform Format
        run: terraform -chdir=$TF_DIR fmt -check -recursive

      - name: Terraform Validate
        run: terraform -chdir=$TF_DIR validate

      - name: Terraform Plan
        run: terraform -chdir=$TF_DIR plan